services:
  proxy_version:
    # 使用预构建镜像而不是本地构建
    image: jackciao/proxy_version:latest
    # 如果预构建镜像不可用，则回退到本地构建
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: proxy_version
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./mock_sys/etc/v2ray-agent:/etc/v2ray-agent
      - ./mock_sys/etc/nginx:/etc/nginx:ro
      - ./mock_sys/etc/systemd/system:/etc/systemd/system
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mock_sys/opt/1panel:/opt/1panel:ro
      - ./mock_sys/www/server:/www/server:ro
      - ./mock_sys/root/.acme.sh:/root/.acme.sh
      # Mount host /proc for nsenter to access host network namespace (multi-IP detection)
      - /proc:/host/proc:ro
      # Mount 1Panel OpenResty directories for camouflage site deployment
      - /opt/1panel/apps/openresty:/opt/1panel/apps/openresty
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET:-debug_secret_key_123456}
      - DATABASE_PATH=/app/data/proxy_version.db
      - DATA_DIR=/app/data
    privileged: true
    pid: host  # Required for nsenter to access host network namespace
    # network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
