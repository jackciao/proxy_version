services:
  proxy_version:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxy_version
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./mock_sys/etc/v2ray-agent:/etc/v2ray-agent
      - ./mock_sys/etc/nginx:/etc/nginx:ro
      - ./mock_sys/etc/systemd/system:/etc/systemd/system
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mock_sys/www/server:/www/server:ro
      # Mount host /root/.acme.sh so we can reuse already-issued certificates
      # and not trigger Let's Encrypt rate limits on repeated camouflage redeploys
      - /root/.acme.sh:/root/.acme.sh
      # Mount host /proc for nsenter to access host network namespace (multi-IP detection)
      - /proc:/host/proc:ro
      # Mount entire 1Panel root so we can access openresty config, www/conf.d and www/sites
      - /opt/1panel:/opt/1panel
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET:-debug_secret_key_123456}
      - DATABASE_PATH=/app/data/proxy_version.db
      - DATA_DIR=/app/data
    privileged: true
    pid: host  # Required for nsenter to access host network namespace
    # network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
